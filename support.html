<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support | Buylance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --bg-top:#EEF3FF; --ink:#0F1B3D; --brand-blue:#2F5FE0;
    --muted:#6B7A99; --card-border:#D7E3FF; --error:#E8412C; --success:#1E8E3E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:linear-gradient(180deg, var(--bg-top) 0%, #FFFFFF 320px);
    color:var(--ink); font-family:'Nunito Sans', sans-serif;
    min-height:100vh; padding:40px 16px; display:flex; flex-direction:column; align-items:center;
  }
  .logo{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:24px; text-decoration:none; color:var(--ink); margin-bottom:26px; }
  .back-home-link{
    display:inline-flex; align-items:center; gap:6px; margin-bottom:14px;
    color:var(--muted); font-weight:700; font-size:13px; text-decoration:none;
  }
  .back-home-link:hover{ color:var(--brand-blue); }
  .logo span{ color:var(--brand-blue); }
  .wrap{ width:100%; max-width:480px; }
  .card{ background:#fff; border:1px solid var(--card-border); border-radius:18px; padding:26px; margin-bottom:16px; }
  h1{ font-family:'Baloo 2', sans-serif; font-size:20px; margin-bottom:4px; }
  h2{ font-family:'Baloo 2', sans-serif; font-size:16px; margin-bottom:10px; }
  .sub{ color:var(--muted); font-size:13px; font-weight:600; margin-bottom:16px; }
  label{ font-weight:700; font-size:12.5px; display:block; margin:12px 0 6px; }
  input, select, textarea{ width:100%; padding:11px 12px; border:1px solid var(--card-border); border-radius:10px; font-family:'Nunito Sans', sans-serif; font-size:14px; }
  textarea{ resize:vertical; }
  button.submit{ margin-top:16px; width:100%; background:var(--brand-blue); color:#fff; border:none; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px; padding:13px; border-radius:10px; cursor:pointer; }
  button.submit:disabled{ opacity:0.6; cursor:default; }
  .error{ color:var(--error); font-size:12.5px; font-weight:700; margin-top:10px; display:none; }

  .ticket{ border:1px solid var(--card-border); border-radius:12px; padding:14px; margin-bottom:10px; }
  .ticket .subj{ font-weight:800; font-size:13.5px; }
  .ticket .status{ display:inline-block; font-size:10px; font-weight:800; padding:3px 8px; border-radius:20px; margin-left:6px; }
  .status-open{ background:#FFF4E5; color:#B8720A; }
  .status-replied{ background:#E9F9EE; color:var(--success); }
  .status-closed{ background:#F1F1F1; color:var(--muted); }
  .ticket .msg{ font-size:13px; color:var(--muted); margin-top:6px; }
  .ticket .reply{ background:#F7F9FF; border-radius:8px; padding:10px; margin-top:8px; font-size:13px; }
  .ticket .reply b{ color:var(--brand-blue); }
  .flag-urgent-btn{
    margin-top:10px; background:#FDEDEC; color:#C0392B; border:1px solid #F5C6C0;
    font-weight:800; font-size:11.5px; padding:6px 12px; border-radius:20px; cursor:pointer;
  }
  .unread-dot{
    display:inline-block; width:8px; height:8px; border-radius:50%; background:#E8412C; margin-left:6px;
  }
  .back-tickets-link-btn{
    background:none; border:none; color:var(--muted); font-weight:700; font-size:13px;
    cursor:pointer; padding:0; margin-bottom:12px; display:inline-flex; align-items:center; gap:4px;
  }
  .back-tickets-link-btn:hover{ color:var(--brand-blue); }
  .ticket-status-banner{
    background:#FFF4E5; color:#8A5B00; font-weight:700; font-size:12.5px;
    padding:10px 14px; border-radius:10px; margin:10px 0;
  }
  .ticket-status-banner.closed{ background:#E9F9EE; color:var(--success); }
  .ticket-thread{
    display:flex; flex-direction:column; gap:10px; max-height:340px; overflow-y:auto;
    background:#F0F3FA; border-radius:12px; padding:14px; margin-top:10px;
  }
  .ticket-thread-big{
    max-height:480px; min-height:320px; padding:18px;
    background-color:#E9EFFC;
    border:2px solid #D7E3FF;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2764%27%20height%3D%2764%27%3E%0A%20%20%3Cg%20fill%3D%27none%27%20stroke%3D%27rgba%2847%2C95%2C224%2C0.16%29%27%20stroke-width%3D%271.6%27%3E%0A%20%20%20%20%3Cpath%20d%3D%27M10%2010h16a3%203%200%200%201%203%203v7a3%203%200%200%201-3%203h-10l-5.5%204.5v-4.5a3%203%200%200%201-3-3v-7a3%203%200%200%201%203-3z%27/%3E%0A%20%20%3C/g%3E%0A%20%20%3Cg%20fill%3D%27rgba%28255%2C122%2C41%2C0.18%29%27%3E%0A%20%20%20%20%3Cpath%20d%3D%27M46%2034%20l1.9%203.9%204.3.6-3.1%203%20.7%204.3-3.8-2-3.8%202%20.7-4.3-3.1-3%204.3-.6z%27/%3E%0A%20%20%3C/g%3E%0A%3C/svg%3E");
    background-size: 64px 64px;
  }
  .ticket-msg-row{ display:flex; }
  .ticket-msg-row.mine{ justify-content:flex-end; }
  .ticket-msg-row.theirs{ justify-content:flex-start; }
  .ticket-msg-bubble{
    max-width:78%; padding:10px 14px; border-radius:16px; font-size:13.5px; line-height:1.55;
  }
  .ticket-msg-row.mine .ticket-msg-bubble{ background:var(--brand-blue); color:#fff; border-bottom-right-radius:4px; }
  .ticket-msg-row.theirs .ticket-msg-bubble{ background:#fff; border:1px solid var(--card-border); border-bottom-left-radius:4px; }
  .ticket-msg-time{ font-size:10px; opacity:0.7; margin-top:4px; }
  .ticket-msg-img{ max-width:200px; border-radius:10px; margin-top:6px; display:block; cursor:pointer; }
  .ticket-reply-row{ display:flex; align-items:center; gap:6px; margin-top:10px; position:relative; }
  .ticket-reply-row input[type="text"]{
    flex:1; padding:11px 12px; border:1px solid var(--card-border); border-radius:10px;
    font-family:'Nunito Sans', sans-serif; font-size:13px;
  }
  .ticket-icon-btn{
    background:#F0F3FA; border:none; border-radius:10px; width:40px; height:40px;
    font-size:17px; cursor:pointer; flex-shrink:0;
  }
  .ticket-emoji-picker{
    display:none; position:absolute; bottom:48px; left:0; background:#fff;
    border:1px solid var(--card-border); border-radius:12px; padding:8px;
    box-shadow:0 8px 24px rgba(0,0,0,0.12); gap:4px; z-index:10;
  }
  .ticket-emoji-picker.open{ display:flex; }
  .ticket-emoji-picker span{ font-size:20px; cursor:pointer; padding:4px; }
  .ticket-urgent{ border-color:#F5C6C0 !important; background:#FFF9F8; }
  .urgent-badge{
    display:inline-block; background:#E8412C; color:#fff; font-size:10px; font-weight:800;
    padding:3px 8px; border-radius:12px; margin-bottom:6px;
  }
  .faq-bot-header{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .faq-bot-avatar{
    width:44px; height:44px; border-radius:50%; background:var(--brand-blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;
  }
  #faqConversation{
    background:#F0F3FA; border-radius:14px; padding:16px; margin-bottom:14px;
    display:flex; flex-direction:column; gap:10px; min-height:120px;
  }
  .faq-chat-row{ display:flex; }
  .faq-chat-row.mine{ justify-content:flex-end; }
  .faq-chat-row.bot{ justify-content:flex-start; align-items:flex-end; gap:8px; }
  .faq-bot-mini-avatar{
    width:26px; height:26px; border-radius:50%; background:var(--brand-blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0;
  }
  .faq-bubble{
    max-width:78%; padding:10px 14px; border-radius:16px; font-size:13.5px; line-height:1.6;
  }
  .faq-chat-row.mine .faq-bubble{
    background:var(--brand-blue); color:#fff; border-bottom-right-radius:4px;
  }
  .faq-chat-row.bot .faq-bubble{
    background:#fff; color:var(--ink); border:1px solid var(--card-border); border-bottom-left-radius:4px;
  }
  .faq-typing-row{ display:flex; align-items:flex-end; gap:8px; }
  .faq-typing-bubble{
    display:flex; align-items:center; gap:5px; padding:12px 16px; width:fit-content;
    background:#fff; border:1px solid var(--card-border); border-radius:16px; border-bottom-left-radius:4px;
  }
  .faq-typing-dot{
    width:7px; height:7px; border-radius:50%; background:var(--muted);
    animation:faqTypingBounce 1.2s infinite ease-in-out;
  }
  .faq-typing-dot:nth-child(2){ animation-delay:0.15s; }
  .faq-typing-dot:nth-child(3){ animation-delay:0.3s; }
  @keyframes faqTypingBounce{
    0%, 60%, 100%{ transform:translateY(0); opacity:0.5; }
    30%{ transform:translateY(-4px); opacity:1; }
  }
  .faq-bubble-in{ animation:faqBubbleIn 0.2s ease; }
  @keyframes faqBubbleIn{ from{ opacity:0; transform:translateY(6px) scale(0.98); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .faq-options{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .faq-option-btn{
    text-align:left; background:#fff; border:1.5px solid var(--card-border); border-radius:12px;
    padding:11px 14px; font-family:'Nunito Sans', sans-serif; font-weight:700; font-size:13px;
    color:var(--ink); cursor:pointer; transition:border-color 0.15s ease, background 0.15s ease;
  }
  .faq-option-btn:hover{ border-color:var(--brand-blue); background:#F7F9FF; }
  .faq-escalate-btn{
    background:var(--brand-blue); color:#fff; border:none; border-radius:12px;
    padding:11px 14px; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:13px;
    cursor:pointer; width:100%; margin-top:4px;
  }
  .faq-end-btn{
    background:transparent; color:var(--muted); border:1px solid var(--card-border); border-radius:12px;
    padding:9px 14px; font-family:'Nunito Sans', sans-serif; font-weight:700; font-size:12.5px;
    cursor:pointer; width:100%; margin-top:8px;
  }
</style>
</head>
<body>

<a href="index.html" class="back-home-link">← Back to Home</a>
<a href="index.html" class="logo">BUY<span>LANCE</span></a>

<div class="wrap">
  

  <div class="card" id="formCard">
    <h1>Contact Support</h1>
    <p class="sub">Send us a message and a real person will reply here. For quick questions, try the chat bubble in the corner instead!</p>

    <label>Subject</label>
    <select id="subject">
      <option>Payment methods</option>
      <option>Is this legit?</option>
      <option>Restock question</option>
      <option>Account issue</option>
      <option>Other</option>
    </select>

    <label>Your Message</label>
    <textarea id="message" rows="4" placeholder="Type your question here..."></textarea>

    <div class="error" id="errorMsg"></div>
    <button class="submit" id="submitBtn" onclick="submitTicket()">Send Message</button>
  </div>

  <div class="card" id="ticketsCard" style="display:none;">
    <h2>💬 Your Messages</h2>
    <div id="ticketsList"></div>
  </div>
</div>

<script>
  let currentUser = null;

  async function init(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    currentUser = session ? session.user : null;
    if(currentUser){
      loadTickets();
    } else {
      document.getElementById('formCard').innerHTML = '<h1>Contact Support</h1><p class="sub">Please <a href="login.html">log in</a> to send us a message.</p>';
    }
  }

  function showError(msg){
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  const NEW_TICKET_WEBHOOK_URL = 'https://discord.com/api/webhooks/1539854970923262013/9Now_qIUyF5kjvE5mgydiRG3d1SUHEc5r4rMmHG5OsZx1HgmR3xIprgA31xPl16n6pw0';
  const URGENT_FLAG_WEBHOOK_URL = 'https://discord.com/api/webhooks/1543453792215896136/o8oa3m8pVaWpcto1kGDhh3kZ3Gckf3efk8R1vrC6GlPMz2dmoIj4V6U0z1Sf9F9lhqds';

  window.submitTicket = async function(){
    document.getElementById('errorMsg').style.display = 'none';
    const subject = document.getElementById('subject').value;
    const message = document.getElementById('message').value.trim();
    if(!message){ showError('Please enter a message.'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    const { data, error } = await supabaseClient.rpc('submit_support_ticket', {
      p_subject: subject,
      p_message: message
    });

    btn.disabled = false;
    btn.textContent = 'Send Message';

    if(error){
      showError('Something went wrong — please try again.');
      return;
    }

    if(!data.ok){
      if(data.error === 'rate_limited'){
        const retryDate = new Date(data.retry_after);
        showError(`You can send one message every 24 hours — try again after ${retryDate.toLocaleString()}.`);
      } else {
        showError('Something went wrong — please try again.');
      }
      return;
    }

    const ticketId = data.ticket_id;

    // Auto-creates a Discord thread for this ticket, same pattern as orders.
    try {
      const res = await fetch(NEW_TICKET_WEBHOOK_URL + '?wait=true', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          content: '🎫 **NEW SUPPORT TICKET**',
          thread_name: `${subject} — ${currentUser.email}`,
          embeds: [{
            title: subject,
            color: 3092790,
            fields: [
              { name: '👤 From', value: currentUser.email },
              { name: '💬 Message', value: message },
              { name: '🔗 Open in Admin', value: `https://buylance.gg/admin-support.html` }
            ]
          }]
        })
      });
      const webhookData = await res.json();
      if(webhookData && webhookData.channel_id){
        await supabaseClient.rpc('set_ticket_discord_thread', { p_ticket_id: ticketId, p_thread_id: webhookData.channel_id });
      }
    } catch(e){
      console.warn('Discord ticket webhook failed (ticket is still saved fine):', e);
    }

    document.getElementById('message').value = '';
    showTicketSentMessage();
    loadTickets();
  };

  function showTicketSentMessage(){
    let el = document.getElementById('ticketSentMsg');
    if(!el){
      el = document.createElement('div');
      el.id = 'ticketSentMsg';
      el.style.cssText = 'background:#E9F9EE; color:var(--success); border:1px solid #B9EBC9; border-radius:10px; padding:10px 14px; font-weight:700; font-size:13px; margin-top:12px;';
      document.getElementById('submitBtn').insertAdjacentElement('afterend', el);
    }
    el.textContent = "✅ Sent! We'll reply as soon as possible.";
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 6000);
  }

  window.flagTicketUrgent = async function(ticketId, subject, message){
    try {
      await supabaseClient.rpc('flag_ticket_urgent', { p_ticket_id: ticketId });
      await fetch(URGENT_FLAG_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          content: `🚩 **Ticket flagged as urgent** by \`${currentUser.email}\`\n**${subject}**\n> ${message}\nhttps://buylance.gg/admin-support.html`
        })
      });
      alert("Got it — we've flagged this as urgent, it'll show at the top of our list.");
      loadTickets();
    } catch(e){
      console.warn('Urgent flag failed:', e);
    }
  };

  async function loadTickets(){
    const { data: tickets, error } = await supabaseClient.rpc('get_my_tickets');
    if(error || !tickets || tickets.length === 0) return;

    document.getElementById('ticketsCard').style.display = 'block';
    document.getElementById('ticketsList').innerHTML = tickets.map(t => `
      <div class="ticket ${t.is_urgent ? 'ticket-urgent' : ''}" style="cursor:pointer;" onclick="openTicketConversation('${t.id}')">
        ${t.is_urgent ? '<span class="urgent-badge">🚩 Urgent</span>' : ''}
        <span class="subj">${t.subject}</span>
        <span class="status status-${t.status}">${t.status}</span>
        ${t.buyer_has_unread ? '<span class="unread-dot"></span>' : ''}
        <div class="msg">${t.message}</div>
        ${t.status === 'open' && !t.is_urgent ? `<button class="flag-urgent-btn" onclick="event.stopPropagation(); flagTicketUrgent('${t.id}', '${t.subject.replace(/'/g, "\\'")}', '${t.message.replace(/'/g, "\\'").replace(/\n/g, ' ')}')">🚩 Flag as Urgent</button>` : ''}
      </div>
    `).join('');
  }

  window.openTicketConversation = async function(ticketId){
    await supabaseClient.rpc('mark_ticket_read', { p_ticket_id: ticketId });

    const { data: tickets } = await supabaseClient.rpc('get_my_tickets');
    const ticket = (tickets || []).find(t => t.id === ticketId);
    if(!ticket) return;

    const { data: msgs } = await supabaseClient.rpc('get_ticket_messages', { p_ticket_id: ticketId });

    document.getElementById('formCard').style.display = 'none';
    document.getElementById('ticketsCard').style.display = 'none';

    let convoCard = document.getElementById('ticketConvoCard');
    if(!convoCard){
      convoCard = document.createElement('div');
      convoCard.id = 'ticketConvoCard';
      convoCard.className = 'card';
      document.querySelector('.wrap').appendChild(convoCard);
    }
    convoCard.style.display = 'block';

    const allMsgs = [
      { sender_type: 'buyer', message: ticket.message, image_url: null, created_at: ticket.created_at },
      ...(msgs || [])
    ];

    const statusBanner = ticket.status === 'closed'
      ? `<div class="ticket-status-banner closed">✅ This ticket has been resolved and closed.</div>`
      : `<div class="ticket-status-banner">⏳ Waiting for support to look into your issue — this can take a little while, thanks for your patience!</div>`;

    convoCard.innerHTML = `
      <button class="back-tickets-link-btn" onclick="closeTicketConversation()">← Back to Messages</button>
      <h2>${ticket.subject}</h2>
      <span class="status status-${ticket.status}">${ticket.status}</span>
      ${statusBanner}
      <div id="ticketConvoThread" class="ticket-thread ticket-thread-big">
        ${allMsgs.map(renderTicketMsgBubble).join('')}
      </div>
      ${ticket.status !== 'closed' ? `
        <div class="ticket-reply-row">
          <button class="ticket-icon-btn" onclick="document.getElementById('ticketEmojiPicker').classList.toggle('open')" title="Emoji">😊</button>
          <div id="ticketEmojiPicker" class="ticket-emoji-picker">
            ${['😀','😅','😢','😡','👍','🙏','❤️','🎉'].map(e => `<span onclick="insertTicketEmoji('${e}')">${e}</span>`).join('')}
          </div>
          <button class="ticket-icon-btn" onclick="document.getElementById('ticketImageInput').click()" title="Attach photo">📎</button>
          <input type="file" id="ticketImageInput" accept="image/*" style="display:none;" onchange="handleTicketImageSelect(event, '${ticketId}')">
          <input type="text" id="ticketReplyInput" placeholder="Type a reply..." onkeydown="if(event.key==='Enter') sendTicketReply('${ticketId}')">
          <button class="submit" style="width:auto; margin:0; padding:11px 18px;" onclick="sendTicketReply('${ticketId}')">Send</button>
        </div>
      ` : ''}
    `;

    const thread = document.getElementById('ticketConvoThread');
    thread.scrollTop = thread.scrollHeight;
  };

  function renderTicketMsgBubble(m){
    const time = new Date(m.created_at).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    const imgHtml = m.image_url ? `<img src="${m.image_url}" class="ticket-msg-img" onclick="window.open('${m.image_url}','_blank')">` : '';
    const textHtml = m.message ? `<div>${m.message}</div>` : '';
    return `
      <div class="ticket-msg-row ${m.sender_type === 'buyer' ? 'mine' : 'theirs'}">
        <div class="ticket-msg-bubble">
          ${textHtml}${imgHtml}
          <div class="ticket-msg-time">${time}</div>
        </div>
      </div>
    `;
  }

  window.insertTicketEmoji = function(emoji){
    const input = document.getElementById('ticketReplyInput');
    input.value += emoji;
    input.focus();
    document.getElementById('ticketEmojiPicker').classList.remove('open');
  };

  window.handleTicketImageSelect = async function(event, ticketId){
    const file = event.target.files[0];
    event.target.value = '';
    if(!file) return;
    try {
      const path = `${Date.now()}_${file.name}`;
      const { error: uploadError } = await supabaseClient.storage.from('chat-uploads').upload(path, file);
      if(uploadError) throw uploadError;
      const { data } = supabaseClient.storage.from('chat-uploads').getPublicUrl(path);
      const { error } = await supabaseClient.rpc('send_ticket_message', {
        p_ticket_id: ticketId,
        p_sender_type: 'buyer',
        p_message: '',
        p_image_url: data.publicUrl
      });
      if(error) throw error;
      openTicketConversation(ticketId);
    } catch(e){
      console.warn('Image upload failed:', e);
      alert('Could not send that image — please try again.');
    }
  };

  window.closeTicketConversation = function(){
    const convoCard = document.getElementById('ticketConvoCard');
    if(convoCard) convoCard.style.display = 'none';
    document.getElementById('formCard').style.display = 'block';
    document.getElementById('ticketsCard').style.display = 'block';
  };

  window.sendTicketReply = async function(ticketId){
    const input = document.getElementById('ticketReplyInput');
    const message = input.value.trim();
    if(!message) return;
    input.value = '';
    const { error } = await supabaseClient.rpc('send_ticket_message', {
      p_ticket_id: ticketId,
      p_sender_type: 'buyer',
      p_message: message
    });
    if(error){ alert('Something went wrong sending that.'); return; }
    openTicketConversation(ticketId);
  };

  init();
</script>
