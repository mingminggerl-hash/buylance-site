<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | Buylance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --bg-top:#EEF3FF; --ink:#0F1B3D; --brand-blue:#2F5FE0;
    --muted:#6B7A99; --card-border:#D7E3FF; --error:#E8412C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:linear-gradient(180deg, var(--bg-top) 0%, #FFFFFF 320px);
    color:var(--ink); font-family:'Nunito Sans', sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:40px 20px;
  }
  .logo{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:24px;
    text-decoration:none; color:var(--ink); margin-bottom:26px;
  }
  .logo span{ color:var(--brand-blue); }
  .card{
    background:#fff; border:1px solid var(--card-border); border-radius:18px;
    padding:30px; width:100%; max-width:380px;
  }
  h1{ font-family:'Baloo 2', sans-serif; font-size:22px; margin-bottom:4px; }
  .sub{ color:var(--muted); font-size:13px; font-weight:600; margin-bottom:20px; }
  label{ font-weight:700; font-size:12.5px; display:block; margin:14px 0 6px; }
  input{
    width:100%; padding:11px 12px; border:1px solid var(--card-border); border-radius:10px;
    font-family:'Nunito Sans', sans-serif; font-size:14px;
  }
  .error{ color:var(--error); font-size:12.5px; font-weight:700; margin-top:10px; display:none; }
  button{
    margin-top:20px; width:100%; background:var(--brand-blue); color:#fff; border:none;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px;
    padding:13px; border-radius:10px; cursor:pointer;
  }
  button:disabled{ opacity:0.6; cursor:default; }
  .foot{ text-align:center; font-size:13px; color:var(--muted); margin-top:14px; font-weight:600; }
  .foot a{ color:var(--brand-blue); font-weight:800; text-decoration:none; }
  .row{ display:flex; justify-content:space-between; margin-top:6px; }
</style>
</head>
<body>

<a href="index.html" class="logo">BUY<span>LANCE</span></a>

<div class="card">
  <h1>Log in</h1>
  <p class="sub">Welcome back — use the password you made for Buylance, not your email's own password.</p>

  <label>Email Address</label>
  <input type="email" id="email" placeholder="you@example.com">

  <label>Password</label>
  <input type="password" id="password" placeholder="Your Buylance password">

  <div class="error" id="errorMsg"></div>

  <button id="loginBtn" onclick="handleLogin()">Log In</button>

  <div class="row">
    <span class="foot"><a href="forgot-password.html">Forgot password?</a></span>
    <span class="foot"><a href="signup.html">Sign up</a></span>
  </div>
</div>

<script>
  function showError(msg){
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  async function handleLogin(){
    document.getElementById('errorMsg').style.display = 'none';
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');

    if(!email || !password){ showError('Please fill in both fields.'); return; }

    btn.disabled = true;
    btn.textContent = 'Logging in...';

    // Check lock + any active countdown BEFORE attempting the real
    // password check, so a locked/waiting account never gets a chance
    // to try guessing further during that window.
    try {
      const { data: status } = await supabaseClient.rpc('check_login_attempt_status', { p_email: email });
      if(status && status.locked){
        btn.disabled = false;
        btn.textContent = 'Log In';
        showError('This account is temporarily locked after several failed attempts. Check your email for a "Was this you?" link, or reset your password.');
        return;
      }
      if(status && status.wait_seconds_remaining > 0){
        btn.disabled = false;
        btn.textContent = 'Log In';
        startLoginCountdown(status.wait_seconds_remaining);
        return;
      }
    } catch(e){ /* if the check itself fails, fall through to a normal login attempt */ }

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    btn.disabled = false;
    btn.textContent = 'Log In';

    if(error){
      if(error.message.toLowerCase().includes('email not confirmed')){
        showError('Please verify your email first — check your inbox for the link.');
      } else {
        try {
          const { data: result } = await supabaseClient.rpc('record_failed_login', { p_email: email });
          if(result && result.locked){
            showError('Too many failed attempts — this account is now locked. Check your email for a "Was this you?" link.');
          } else if(result && result.wait_seconds > 0){
            showError('Incorrect email or password.');
            startLoginCountdown(result.wait_seconds);
          } else {
            showError('Incorrect email or password.');
          }
        } catch(e){
          showError('Incorrect email or password.');
        }
      }
      return;
    }

    try { await supabaseClient.rpc('record_successful_login', { p_email: email }); } catch(e){}

    window.location.href = 'index.html';
  }

  function startLoginCountdown(seconds){
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    let remaining = seconds;
    const tick = () => {
      if(remaining <= 0){
        btn.disabled = false;
        btn.textContent = 'Log In';
        showError('You can try again now.');
        return;
      }
      btn.textContent = `Wait ${remaining}s...`;
      showError(`Too many attempts — please wait ${remaining} second${remaining === 1 ? '' : 's'} before trying again.`);
      remaining--;
      setTimeout(tick, 1000);
    };
    tick();
  }
</script>


</body>
</html>
