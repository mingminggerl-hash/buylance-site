<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Buylance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --bg-top:#EEF3FF; --ink:#0F1B3D; --brand-blue:#2F5FE0;
    --muted:#6B7A99; --card-border:#D7E3FF; --error:#E8412C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:linear-gradient(180deg, var(--bg-top) 0%, #FFFFFF 320px);
    color:var(--ink); font-family:'Nunito Sans', sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:40px 20px;
  }
  .logo{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:24px;
    text-decoration:none; color:var(--ink); margin-bottom:26px;
  }
  .logo span{ color:var(--brand-blue); }
  .card{
    background:#fff; border:1px solid var(--card-border); border-radius:18px;
    padding:30px; width:100%; max-width:380px;
  }
  h1{ font-family:'Baloo 2', sans-serif; font-size:22px; margin-bottom:4px; }
  .sub{ color:var(--muted); font-size:13px; font-weight:600; margin-bottom:20px; }
  label{ font-weight:700; font-size:12.5px; display:block; margin:14px 0 6px; }
  input{
    width:100%; padding:11px 12px; border:1px solid var(--card-border); border-radius:10px;
    font-family:'Nunito Sans', sans-serif; font-size:14px;
  }
  .error{ color:var(--error); font-size:12.5px; font-weight:700; margin-top:10px; display:none; }
  .success{ display:none; text-align:center; padding:10px 0; }
  .success .big{ font-size:34px; margin-bottom:8px; }
  button{
    margin-top:20px; width:100%; background:var(--brand-blue); color:#fff; border:none;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px;
    padding:13px; border-radius:10px; cursor:pointer;
  }
  button:disabled{ opacity:0.6; cursor:default; }
  .foot{ text-align:center; font-size:13px; color:var(--muted); margin-top:18px; font-weight:600; }
  .foot a{ color:var(--brand-blue); font-weight:800; text-decoration:none; }
</style>
</head>
<body>

<a href="index.html" class="logo">BUY<span>LANCE</span></a>

<div class="card">
  <div id="resetForm">
    <h1>Set a new password</h1>
    <p class="sub">Make it something new — at least 8 characters.</p>

    <label>New Password</label>
    <input type="password" id="newPassword" placeholder="At least 8 characters">

    <label>Confirm New Password</label>
    <input type="password" id="confirmNewPassword" placeholder="Re-enter password">

    <div class="error" id="errorMsg"></div>

    <button id="updateBtn" onclick="handleUpdate()">Update Password</button>
  </div>

  <div class="success" id="successMsg">
    <div class="big">✅</div>
    <h1>Password updated</h1>
    <p class="sub">You're all set — log in with your new password.</p>
    <div class="foot"><a href="login.html">Go to Log In</a></div>
  </div>
</div>

<script>
  function showError(msg){
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  async function handleUpdate(){
    document.getElementById('errorMsg').style.display = 'none';
    const newPassword = document.getElementById('newPassword').value;
    const confirmNewPassword = document.getElementById('confirmNewPassword').value;
    const btn = document.getElementById('updateBtn');

    if(newPassword.length < 8){ showError('Password must be at least 8 characters.'); return; }
    if(newPassword !== confirmNewPassword){ showError('Passwords do not match.'); return; }

    btn.disabled = true;
    btn.textContent = 'Updating...';

    // Supabase reads the reset token from the URL automatically (it's in
    // the link from the email), so we just call updateUser directly.
    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

    btn.disabled = false;
    btn.textContent = 'Update Password';

    if(error){
      showError('This reset link may have expired. Please request a new one.');
      return;
    }

    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  }
</script>

</body>
</html>
