<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Tickets | Buylance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --bg-top:#EEF3FF; --ink:#0F1B3D; --brand-blue:#2F5FE0;
    --muted:#6B7A99; --card-border:#D7E3FF; --error:#E8412C; --success:#1E8E3E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:linear-gradient(180deg, var(--bg-top) 0%, #FFFFFF 320px);
    color:var(--ink); font-family:'Nunito Sans', sans-serif;
    min-height:100vh; padding:30px 16px;
  }
  .logo{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:22px; text-decoration:none; color:var(--ink); }
  .back-home-link{
    display:inline-flex; align-items:center; gap:6px; margin-bottom:10px;
    color:var(--muted); font-weight:700; font-size:13px; text-decoration:none;
  }
  .back-home-link:hover{ color:var(--brand-blue); }
  .back-tickets-link{
    display:inline-flex; align-items:center; gap:6px; margin-bottom:12px;
    color:var(--brand-blue); font-weight:800; font-size:13px; text-decoration:none;
  }
  .logo span{ color:var(--brand-blue); }
  .layout{ display:flex; gap:20px; max-width:900px; margin:20px auto 0; align-items:flex-start; }
  .col-list{ width:300px; flex-shrink:0; }
  .col-detail{ flex:1; min-width:0; }
  .card{ background:#fff; border:1px solid var(--card-border); border-radius:16px; padding:16px; }
  h2{ font-family:'Baloo 2', sans-serif; font-size:16px; margin-bottom:10px; }
  .sub{ color:var(--muted); font-size:12.5px; font-weight:600; }

  .ticket-row{ padding:10px; border-radius:10px; cursor:pointer; margin-bottom:6px; border:1px solid var(--card-border); }
  .ticket-row:hover{ background:#F7F9FF; }
  .ticket-row.active{ background:#EAF3FF; border-color:var(--brand-blue); }
  .ticket-row-urgent{ border-color:#F5C6C0; background:#FFF9F8; }
  .urgent-badge{
    display:inline-block; background:#E8412C; color:#fff; font-size:9.5px; font-weight:800;
    padding:2px 7px; border-radius:12px; margin-bottom:4px;
  }
  .ticket-row .subj{ font-weight:800; font-size:13px; }
  .ticket-row .who{ font-size:11.5px; color:var(--muted); font-weight:600; }
  .status-badge{ display:inline-block; font-size:10px; font-weight:800; padding:3px 8px; border-radius:20px; margin-top:4px; }
  .status-open{ background:#FFF4E5; color:#B8720A; }
  .status-replied{ background:#E9F9EE; color:var(--success); }
  .status-closed{ background:#F1F1F1; color:var(--muted); }

  textarea{ width:100%; padding:10px 12px; border:1px solid var(--card-border); border-radius:10px; font-family:'Nunito Sans', sans-serif; font-size:13px; margin-top:8px; resize:vertical; }
  button.action{ background:var(--brand-blue); color:#fff; border:none; padding:11px 16px; border-radius:10px; font-weight:800; font-size:13px; cursor:pointer; margin-top:8px; }
  .msg-box{ background:#F7F9FF; border-radius:10px; padding:12px; font-size:13px; margin:10px 0; }
  .reply-box{ background:#E9F9EE; border-radius:10px; padding:12px; font-size:13px; margin:10px 0; }
  .ticket-thread{
    display:flex; flex-direction:column; gap:10px; max-height:340px; overflow-y:auto;
    background:#F7F9FF; border-radius:12px; padding:14px; margin:10px 0;
  }
  .ticket-msg-row{ display:flex; }
  .ticket-msg-row.mine{ justify-content:flex-end; }
  .ticket-msg-row.theirs{ justify-content:flex-start; }
  .ticket-msg-bubble{
    max-width:78%; padding:10px 14px; border-radius:16px; font-size:13.5px; line-height:1.55;
  }
  .ticket-msg-row.mine .ticket-msg-bubble{ background:var(--brand-blue); color:#fff; border-bottom-right-radius:4px; }
  .ticket-msg-row.theirs .ticket-msg-bubble{ background:#fff; border:1px solid var(--card-border); border-bottom-left-radius:4px; }
</style>
</head>
<body>

<a href="index.html" class="back-home-link">← Back to Home</a>
<a href="index.html" class="logo">BUY<span>LANCE</span> <span style="color:var(--muted); font-size:14px;">Support Tickets</span></a>

<div id="accessGate" class="card" style="max-width:500px; margin:40px auto;">
  <p class="sub">Checking access…</p>
</div>

<div class="layout" id="dashboardLayout" style="display:none;">
  <div class="col-list">
    <div class="card">
      <h2>💬 Tickets</h2>
      <div id="ticketsList"><p class="sub">Loading…</p></div>
    </div>
  </div>
  <div class="col-detail">
    <div class="card" id="ticketDetailCard">
      <p class="sub">Select a ticket to view it.</p>
    </div>
  </div>
</div>

<script>
  let currentUser = null;
  let activeTicketId = null;

  async function init(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    currentUser = session ? session.user : null;
    if(!currentUser){
      document.getElementById('accessGate').innerHTML = '<p class="sub">Please <a href="login.html">log in</a> to access this page.</p>';
      return;
    }
    const { data: profile } = await supabaseClient.from('profiles').select('is_admin').eq('id', currentUser.id).single();
    if(!profile || !profile.is_admin){
      document.getElementById('accessGate').innerHTML = '<p class="sub">You don\'t have access to this page.</p>';
      return;
    }
    document.getElementById('accessGate').style.display = 'none';
    document.getElementById('dashboardLayout').style.display = 'flex';
    await loadTicketsList();

    supabaseClient
      .channel('admin_tickets_list')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'support_tickets' }, () => loadTicketsList())
      .subscribe();
  }

  async function loadTicketsList(){
    const { data: tickets } = await supabaseClient.from('support_tickets').select('*').order('created_at', { ascending: false });
    const list = document.getElementById('ticketsList');
    if(!tickets || tickets.length === 0){
      list.innerHTML = '<p class="sub">No tickets yet.</p>';
      return;
    }
    // Urgent tickets always float to the top, regardless of date.
    const sorted = [...tickets].sort((a, b) => (b.is_urgent ? 1 : 0) - (a.is_urgent ? 1 : 0));
    list.innerHTML = sorted.map(t => `
      <div class="ticket-row ${t.id === activeTicketId ? 'active' : ''} ${t.is_urgent ? 'ticket-row-urgent' : ''}" onclick="selectTicket('${t.id}')">
        ${t.is_urgent ? '<span class="urgent-badge">🚩 Urgent</span>' : ''}
        <div class="subj">${t.subject}</div>
        <div class="who">${t.email}</div>
        <span class="status-badge status-${t.status}">${t.status}</span>
      </div>
    `).join('');
  }

  window.selectTicket = async function(ticketId){
    activeTicketId = ticketId;
    await loadTicketsList();
    const { data: ticket, error } = await supabaseClient.from('support_tickets').select('*').eq('id', ticketId).single();
    if(error || !ticket){
      document.getElementById('ticketDetailCard').innerHTML = '<p class="sub">Ticket not found.</p>';
      return;
    }
    const { data: msgs } = await supabaseClient.rpc('get_ticket_messages', { p_ticket_id: ticketId });
    const allMsgs = [
      { sender_type: 'buyer', message: ticket.message, created_at: ticket.created_at },
      ...(msgs || [])
    ];

    document.getElementById('ticketDetailCard').innerHTML = `
      <a href="#" class="back-tickets-link" onclick="clearTicketSelection(); return false;">← Back to Tickets</a>
      <span class="status-badge status-${ticket.status}">${ticket.status}</span>
      <h2>${ticket.subject}</h2>
      <p class="sub">From: ${ticket.email}</p>
      <div class="ticket-thread">
        ${allMsgs.map(m => `
          <div class="ticket-msg-row ${m.sender_type === 'admin' ? 'mine' : 'theirs'}">
            <div class="ticket-msg-bubble">${m.message}</div>
          </div>
        `).join('')}
      </div>
      ${ticket.status !== 'closed' ? `
        <textarea id="replyText" rows="3" placeholder="Type your reply..."></textarea>
        <button class="action" onclick="sendReply('${ticket.id}')">Send Reply</button>
        <button class="action" style="background:#1E8E3E; margin-left:8px;" onclick="markTicketClosed('${ticket.id}')">✅ Mark Resolved</button>
      ` : `<p class="sub" style="margin-top:8px;">✅ Closed — this thread will auto-archive on Discord 24 hours after closing.</p>`}
    `;
  };

  window.clearTicketSelection = function(){
    activeTicketId = null;
    loadTicketsList();
    document.getElementById('ticketDetailCard').innerHTML = '<p class="sub">Select a ticket to view it.</p>';
  };

  window.sendReply = async function(ticketId){
    const reply = document.getElementById('replyText').value.trim();
    if(!reply){ alert('Please type a reply first.'); return; }
    const { error } = await supabaseClient.rpc('send_ticket_message', {
      p_ticket_id: ticketId,
      p_sender_type: 'admin',
      p_message: reply
    });
    if(error){ alert('Something went wrong.'); return; }
    selectTicket(ticketId);
  };

  window.markTicketClosed = async function(ticketId){
    const { error } = await supabaseClient.rpc('close_ticket', { p_ticket_id: ticketId });
    if(error){ alert('Something went wrong.'); return; }
    selectTicket(ticketId);
  };

  init();
</script>

</body>
</html>
