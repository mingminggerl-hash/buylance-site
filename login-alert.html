<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Was This You? | Buylance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --bg-top:#EEF3FF; --ink:#0F1B3D; --brand-blue:#2F5FE0;
    --muted:#6B7A99; --card-border:#D7E3FF; --error:#E8412C; --success:#1E8E3E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:linear-gradient(180deg, var(--bg-top) 0%, #FFFFFF 320px);
    color:var(--ink); font-family:'Nunito Sans', sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  .logo{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:24px;
    text-decoration:none; color:var(--ink); margin-bottom:26px;
  }
  .logo span{ color:var(--brand-blue); }
  .card{
    background:#fff; border:1px solid var(--card-border); border-radius:18px;
    padding:34px 30px; width:100%; max-width:400px; text-align:center;
  }
  .big{ font-size:44px; margin-bottom:12px; }
  h1{ font-family:'Baloo 2', sans-serif; font-size:20px; margin-bottom:8px; }
  .sub{ color:var(--muted); font-size:13.5px; font-weight:600; margin-bottom:22px; line-height:1.6; }
  .choice-row{ display:flex; gap:10px; }
  button{
    flex:1; background:var(--brand-blue); color:#fff; border:none;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px;
    padding:13px; border-radius:10px; cursor:pointer;
  }
  button.secondary{ background:#F1F1F1; color:var(--ink); }
  a.btn{
    display:inline-block; width:100%; background:var(--brand-blue); color:#fff; text-decoration:none;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px;
    padding:13px; border-radius:10px; box-sizing:border-box;
  }
</style>
</head>
<body>

<a href="index.html" class="logo">BUY<span>LANCE</span></a>

<div class="card" id="mainCard">
  <p class="sub">Loading...</p>
</div>

<script>
  function getParam(name){
    return new URLSearchParams(window.location.search).get(name);
  }

  async function init(){
    const token = getParam('token');
    const presetAnswer = getParam('answer');

    if(!token){
      document.getElementById('mainCard').innerHTML = `
        <div class="big">⚠️</div>
        <h1>Invalid link</h1>
        <p class="sub">This link is missing some information — please use the link exactly as it appeared in your email.</p>
      `;
      return;
    }

    if(presetAnswer === 'yes'){
      await answer('yes');
    } else {
      // Show the actual question with two real buttons, rather than
      // assuming intent just from a clicked email link.
      document.getElementById('mainCard').innerHTML = `
        <div class="big">🔔</div>
        <h1>Was this you?</h1>
        <p class="sub">We noticed several failed login attempts on your account. Was that you trying to log in?</p>
        <div class="choice-row">
          <button onclick="answer('yes')">Yes, that was me</button>
          <button class="secondary" onclick="answer('no')">No, wasn't me</button>
        </div>
      `;
    }
  }

  window.answer = async function(value){
    document.getElementById('mainCard').innerHTML = '<p class="sub">Just a moment...</p>';
    const token = getParam('token');

    const { data, error } = await supabaseClient.rpc('confirm_login_alert', {
      p_token: token,
      p_answer: value
    });

    if(error || !data || !data.ok){
      document.getElementById('mainCard').innerHTML = `
        <div class="big">⚠️</div>
        <h1>Link already used or expired</h1>
        <p class="sub">This confirmation link isn't valid anymore — if you're still having trouble logging in, reset your password or contact support.</p>
        <a href="forgot-password.html" class="btn">Reset Password</a>
      `;
      return;
    }

    if(data.action === 'unlocked'){
      document.getElementById('mainCard').innerHTML = `
        <div class="big">✅</div>
        <h1>All good — you're unlocked</h1>
        <p class="sub">Thanks for confirming. Your account is unlocked again, go ahead and log in.</p>
        <a href="login.html" class="btn">Go to Log In</a>
      `;
    } else if(data.action === 'reset_needed'){
      document.getElementById('mainCard').innerHTML = `
        <div class="big">🔒</div>
        <h1>Let's secure your account</h1>
        <p class="sub">Good thing you told us. Your account is staying locked for now — reset your password to get back in safely.</p>
        <a href="forgot-password.html" class="btn">Reset Password</a>
      `;
    }
  };

  init();
</script>

</body>
</html>
