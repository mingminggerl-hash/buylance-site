<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Order | BuyRBLX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --bg-top:#EEF3FF; --ink:#0F1B3D; --brand-blue:#2F5FE0;
    --muted:#6B7A99; --card-border:#D7E3FF; --error:#E8412C; --success:#1E8E3E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:linear-gradient(180deg, var(--bg-top) 0%, #FFFFFF 320px);
    color:var(--ink); font-family:'Nunito Sans', sans-serif;
    min-height:100vh; padding:30px 16px; display:flex; flex-direction:column; align-items:center;
  }
  .logo{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:22px; text-decoration:none; color:var(--ink); margin-bottom:20px; }
  .logo span{ color:var(--brand-blue); }
  .wrap{ width:100%; max-width:520px; }
  .card{ background:#fff; border:1px solid var(--card-border); border-radius:16px; padding:20px; margin-bottom:14px; }
  h2{ font-family:'Baloo 2', sans-serif; font-size:18px; margin-bottom:10px; }
  .status-badge{ display:inline-block; font-size:11px; font-weight:800; padding:4px 10px; border-radius:20px; margin-bottom:10px; }
  .status-badge-big{
    display:inline-flex; align-items:center; gap:10px; font-size:17px; font-weight:800;
    padding:14px 22px; border-radius:16px; margin-bottom:14px; width:100%;
    box-sizing:border-box;
  }
  .status-badge-big .status-icon{ font-size:26px; }
  .hourglass-spin{ display:inline-block; animation:hourglassFlip 2.2s ease-in-out infinite; }
  @keyframes hourglassFlip{ 0%,45%{transform:rotate(0deg);} 55%,100%{transform:rotate(180deg);} }
  .progress-pulse{ display:inline-block; animation:progressPulse 1.3s ease-in-out infinite; }
  @keyframes progressPulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.55; transform:scale(0.92);} }
  .back-home-link{
    display:inline-flex; align-items:center; gap:6px; margin-bottom:16px;
    color:var(--muted); font-weight:700; font-size:13px; text-decoration:none;
  }
  .back-home-link:hover{ color:var(--brand-blue); }
  .status-waiting_for_seller{ background:#FFF4E5; color:#B8720A; }
  .status-in_progress{ background:#EAF3FF; color:var(--brand-blue); }
  .status-delivered{ background:#E9F9EE; color:var(--success); }
  .status-completed{ background:#E9F9EE; color:var(--success); }
  .status-disputed{ background:#FDEBEA; color:var(--error); }
  .status-cancelled{ background:#F1F1F1; color:var(--muted); }
  .item-line{ font-size:13px; color:var(--muted); font-weight:600; padding:3px 0; }
  .total-line{ font-weight:900; font-size:15px; margin-top:8px; border-top:1px solid var(--card-border); padding-top:8px; }

  #reminder-banner{ display:none; background:var(--error); color:#fff; padding:12px; border-radius:10px; margin-bottom:12px; text-align:center; font-weight:800; font-size:13px; }

  #chat-box{
    height:340px; overflow-y:auto; border-radius:16px; padding:16px; margin-bottom:10px;
    display:flex; flex-direction:column; gap:10px;
    background-color:#E9EFFC;
    border:2px solid #D7E3FF;
    box-shadow:inset 0 2px 8px rgba(47,95,224,0.06);
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2764%27%20height%3D%2764%27%3E%0A%20%20%3Cg%20fill%3D%27none%27%20stroke%3D%27rgba%2847%2C95%2C224%2C0.16%29%27%20stroke-width%3D%271.6%27%3E%0A%20%20%20%20%3Cpath%20d%3D%27M10%2010h16a3%203%200%200%201%203%203v7a3%203%200%200%201-3%203h-10l-5.5%204.5v-4.5a3%203%200%200%201-3-3v-7a3%203%200%200%201%203-3z%27/%3E%0A%20%20%3C/g%3E%0A%20%20%3Cg%20fill%3D%27rgba%28255%2C122%2C41%2C0.18%29%27%3E%0A%20%20%20%20%3Cpath%20d%3D%27M46%2034%20l1.9%203.9%204.3.6-3.1%203%20.7%204.3-3.8-2-3.8%202%20.7-4.3-3.1-3%204.3-.6z%27/%3E%0A%20%20%3C/g%3E%0A%3C/svg%3E");
    background-size: 64px 64px;
  }
  .chat-helper-tip{
    background:linear-gradient(90deg, #EAF3FF, #F7F9FF);
    border:1px solid var(--card-border); border-radius:12px;
    padding:10px 14px; font-size:12.5px; color:var(--muted); font-weight:600;
    margin-bottom:12px; line-height:1.5;
  }
  .chat-helper-tip b{ color:var(--ink); }
  .chat-helper-tip a{ color:var(--brand-blue); font-weight:800; text-decoration:none; }
  .reply-quote{
    display:block; border-left:3px solid var(--brand-blue); background:rgba(47,95,224,0.08);
    border-radius:6px; padding:5px 9px; margin-bottom:6px; cursor:pointer;
  }
  .msg-row.sent .reply-quote{ border-left-color:rgba(255,255,255,0.85); background:rgba(255,255,255,0.15); }
  .reply-quote-sender{ display:block; font-size:11px; font-weight:800; color:var(--brand-blue); }
  .msg-row.sent .reply-quote-sender{ color:#fff; }
  .reply-quote-text{ display:block; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; }
  .msg-row.sent .reply-quote-text{ color:rgba(255,255,255,0.85); }
  .flash-highlight{ animation:flashHighlight 1.2s ease; border-radius:10px; }
  @keyframes flashHighlight{ 0%{ background:rgba(255,122,41,0.25); } 100%{ background:transparent; } }
  .img-lightbox{
    position:fixed; inset:0; background:rgba(10,14,30,0.9); z-index:9999;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.2s ease;
  }
  .img-lightbox.open{ opacity:1; pointer-events:auto; }
  .img-lightbox img{ max-width:92vw; max-height:88vh; border-radius:10px; box-shadow:0 10px 50px rgba(0,0,0,0.5); }
  .img-lightbox-close{
    position:absolute; top:18px; right:22px; color:#fff; font-size:26px; font-weight:800;
    cursor:pointer; opacity:0.85;
  }
  .img-lightbox-close:hover{ opacity:1; }
  .msg-row{ display:flex; flex-direction:column; max-width:78%; }
  .msg-row.sent{ align-self:flex-end; align-items:flex-end; }
  .msg-row.received{ align-self:flex-start; align-items:flex-start; }
  .msg-row.system-row{ align-self:center; align-items:center; max-width:90%; }
  .bubble{ padding:10px 14px; border-radius:16px; font-size:13.5px; line-height:1.45; word-break:break-word; }
  .msg-row.sent .bubble{ background:var(--brand-blue); color:#fff; border-bottom-right-radius:4px; }
  .msg-row.received .bubble{ background:#fff; color:var(--ink); border:1px solid var(--card-border); border-bottom-left-radius:4px; }
  .msg-row.system-row .bubble{ background:#FFF4E5; color:#8A5B00; border-radius:14px; font-size:12.5px; font-weight:700; text-align:center; }
  .msg-row.system-row.delivery-row .bubble{ background:#E9F9EE; color:var(--success); border:1px solid #BFE8CC; text-align:left; max-width:320px; }
  .msg-time{ font-size:10.5px; color:var(--muted); font-weight:600; margin-top:3px; padding:0 4px; }
  .bubble img.chat-img{ max-width:220px; max-height:220px; border-radius:10px; margin-top:6px; cursor:pointer; display:block; }

  .msg-with-avatar{ display:flex; gap:8px; align-items:flex-end; }
  .msg-with-avatar.sent{ flex-direction:row-reverse; }
  .msg-avatar{ width:26px; height:26px; border-radius:50%; object-fit:cover; flex-shrink:0; background:#E4EAF7; }
  .unsend-link{ font-size:10px; color:var(--error); font-weight:700; cursor:pointer; margin-top:2px; opacity:0.75; }
  .msg-context-menu{ display:none; position:fixed; background:#fff; border:1px solid var(--card-border); border-radius:12px; box-shadow:0 10px 30px rgba(15,27,61,0.25); z-index:200; overflow:hidden; min-width:170px; }
  .msg-context-menu .menu-item{ padding:11px 16px; font-size:13.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:8px; }
  .msg-context-menu .menu-item:hover{ background:#F0F3FA; }
  .msg-context-menu .menu-item.danger{ color:var(--error); }
  .msg-context-menu .menu-divider{ border-top:1px solid var(--card-border); margin:2px 0; }
  .reply-preview-bar{ display:none; background:#F0F3FA; border-left:3px solid var(--brand-blue); border-radius:8px; padding:7px 10px; margin-bottom:8px; font-size:12px; align-items:center; gap:8px; }
  .reply-preview-bar .reply-text{ flex:1; color:var(--muted); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .reply-preview-bar .reply-cancel{ cursor:pointer; font-weight:800; color:var(--muted); }
  .quoted-reply{ background:rgba(0,0,0,0.06); border-left:2px solid rgba(0,0,0,0.2); border-radius:6px; padding:4px 8px; margin-bottom:5px; font-size:11.5px; opacity:0.85; }

  .unsend-link:hover{ opacity:1; text-decoration:underline; }

  .send-preview{ display:none; background:#F0F3FA; border:1px solid var(--card-border); border-radius:12px; padding:10px; margin-bottom:10px; align-items:center; gap:10px; }
  .send-preview img{ width:56px; height:56px; border-radius:8px; object-fit:cover; }
  .send-preview .preview-actions{ margin-left:auto; display:flex; gap:8px; }
  .send-preview button{ border:none; padding:8px 14px; border-radius:8px; font-weight:800; font-size:12.5px; cursor:pointer; }
  .send-preview .confirm-send{ background:var(--brand-blue); color:#fff; }
  .send-preview .cancel-send{ background:#fff; border:1px solid var(--card-border); color:var(--muted); }
  .emoji-btn{ background:#F0F3FA; border:1px solid var(--card-border); color:var(--muted); border-radius:10px; width:42px; height:42px; font-size:18px; cursor:pointer; flex-shrink:0; }
  .emoji-btn:hover{ background:#E4EAF7; }
  .emoji-picker{ display:none; position:absolute; bottom:56px; background:#fff; border:1px solid var(--card-border); border-radius:12px; box-shadow:0 10px 25px rgba(15,27,61,0.15); padding:10px; z-index:50; width:260px; grid-template-columns:repeat(7,1fr); gap:4px; }
  .emoji-picker span{ cursor:pointer; font-size:19px; text-align:center; border-radius:6px; padding:4px 0; }
  .emoji-picker span:hover{ background:#F0F3FA; }

  .reaction-bar{ display:none; position:absolute; bottom:100%; background:#fff; border:1px solid var(--card-border); border-radius:20px; box-shadow:0 6px 16px rgba(15,27,61,0.15); padding:5px 8px; gap:4px; z-index:40; }
  .reaction-bar span{ cursor:pointer; font-size:17px; padding:2px; }
  .reaction-bar span:hover{ transform:scale(1.25); }
  .bubble-wrap{ position:relative; }
  .react-trigger{ display:none; position:absolute; top:-10px; right:-8px; background:#fff; border:1px solid var(--card-border); border-radius:50%; width:22px; height:22px; font-size:12px; align-items:center; justify-content:center; cursor:pointer; }
  .bubble-wrap:hover .react-trigger{ display:flex; }
  .reaction-pills{ display:flex; gap:4px; flex-wrap:wrap; margin-top:3px; }
  .reaction-pill{ background:#F0F3FA; border:1px solid var(--card-border); border-radius:12px; padding:1px 7px; font-size:11.5px; cursor:pointer; display:flex; align-items:center; gap:3px; }
  .reaction-pill.mine{ background:#E4EAF7; border-color:var(--brand-blue); }

  .delivery-title{ font-weight:800; font-size:12.5px; margin-bottom:6px; }

  .chat-row{ display:flex; gap:8px; align-items:center; }
  .chat-row input[type=text]{ flex:1; padding:11px 12px; border:1px solid var(--card-border); border-radius:10px; font-family:'Nunito Sans', sans-serif; font-size:13px; }
  .chat-row button.send-btn{ background:var(--brand-blue); color:#fff; border:none; border-radius:10px; padding:0 18px; font-weight:800; font-size:13px; cursor:pointer; height:42px; }
  .chat-row button.attach-btn{ background:#F0F3FA; border:1px solid var(--card-border); color:var(--muted); border-radius:10px; width:42px; height:42px; font-size:18px; cursor:pointer; flex-shrink:0; }
  .chat-row button.attach-btn:hover{ background:#E4EAF7; }

  .proof-box{ margin-top:10px; }
  .proof-box img{ max-width:100%; border-radius:10px; border:1px solid var(--card-border); }
  .action-row{ display:flex; gap:8px; margin-top:12px; }
  .btn-confirm{ flex:1; background:var(--success); color:#fff; border:none; padding:12px; border-radius:10px; font-weight:800; font-size:13px; cursor:pointer; }
  .btn-report{ flex:1; background:#fff; color:var(--error); border:1px solid var(--error); padding:12px; border-radius:10px; font-weight:800; font-size:13px; cursor:pointer; }

  select, textarea{ width:100%; padding:10px 12px; border:1px solid var(--card-border); border-radius:10px; font-family:'Nunito Sans', sans-serif; font-size:13px; margin-top:8px; }

  .sub{ color:var(--muted); font-size:12.5px; font-weight:600; }
  .center{ text-align:center; padding:20px; }

  /* Status hero with progress steps */
  .status-hero{ position:relative; overflow:hidden; border-radius:18px; padding:18px 18px 16px; margin-bottom:16px; color:#fff;
    background:linear-gradient(120deg, var(--h1), var(--h2), var(--h1)); background-size:220% 100%; animation:heroShift 6s ease-in-out infinite; }
  .status-hero.s-waiting{ --h1:#FF8A3D; --h2:#FFB547; }
  .status-hero.s-progress{ --h1:#2F5FE0; --h2:#7B5CFF; }
  .status-hero.s-delivered{ --h1:#16A34A; --h2:#34D399; }
  .status-hero.s-completed{ --h1:#1E8E3E; --h2:#2FBF71; }
  .status-hero.s-disputed{ --h1:#E8412C; --h2:#FF7A6B; }
  .status-hero.s-cancelled{ --h1:#7C879E; --h2:#A3ACBF; }
  .hero-top{ display:flex; align-items:center; gap:14px; }
  .hero-ico{ width:52px; height:52px; border-radius:16px; background:rgba(255,255,255,0.22); display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0; }
  .hero-ico span{ display:inline-block; }
  .hero-title{ font:800 19px/1.2 'Baloo 2', sans-serif; }
  .hero-sub{ font-size:12.5px; font-weight:700; opacity:.92; margin-top:2px; }
  .steps{ display:flex; align-items:flex-start; margin-top:16px; }
  .step{ flex:1; text-align:center; position:relative; font-size:11px; font-weight:800; opacity:.75; }
  .step::before{ content:""; position:absolute; top:13px; left:-50%; width:100%; height:3px; background:rgba(255,255,255,0.35); }
  .step:first-child::before{ display:none; }
  .step.done::before, .step.now::before{ background:#fff; }
  .step .dot{ position:relative; z-index:1; width:28px; height:28px; margin:0 auto 5px; border-radius:50%; background:rgba(255,255,255,0.3); display:flex; align-items:center; justify-content:center; font-size:13px; }
  .step.done, .step.now{ opacity:1; }
  .step.done .dot{ background:#fff; color:var(--ink); }
  .step.now .dot{ background:#fff; color:var(--ink); animation:stepPing 1.6s ease-out infinite; }
  .anim-flip{ animation:hourglassFlip 2.2s ease-in-out infinite; }
  .anim-spin{ animation:heroSpin 2.4s linear infinite; }
  .anim-bounce{ animation:heroBounce 1.4s ease-in-out infinite; }
  .anim-pop{ animation:heroPop 1.8s ease-in-out infinite; }
  @keyframes heroShift{ 0%,100%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } }
  @keyframes stepPing{ 0%{ box-shadow:0 0 0 0 rgba(255,255,255,0.75); } 100%{ box-shadow:0 0 0 12px rgba(255,255,255,0); } }
  @keyframes heroSpin{ to{ transform:rotate(360deg); } }
  @keyframes heroBounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
  @keyframes heroPop{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.15); } }

  /* Chat header */
  .chat-head{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .chat-head img, .chat-head .ph{ width:44px; height:44px; border-radius:50%; padding:2px; background:linear-gradient(135deg, #2F5FE0, #FF7A29); object-fit:cover; flex-shrink:0; }
  .chat-head .name{ font:800 16px 'Baloo 2', sans-serif; }
  .chat-head .presence{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--muted); }
  .chat-head .presence i{ width:8px; height:8px; border-radius:50%; background:#22C55E; animation:presencePulse 1.8s ease-in-out infinite; }
  .remind-btn{ margin-left:auto; border:none; cursor:pointer; border-radius:999px; padding:9px 14px; font:800 12.5px 'Baloo 2', sans-serif;
    background:linear-gradient(90deg, #FF7A29, #FF4D4D); color:#fff; box-shadow:0 8px 18px -8px rgba(255,90,40,0.9); transition:transform .15s ease; }
  .remind-btn:hover{ transform:translateY(-2px); }
  .remind-btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }
  .remind-btn .bell{ display:inline-block; animation:bellSwing 2.4s ease-in-out infinite; }
  @keyframes presencePulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(34,197,94,0.6); } 50%{ box-shadow:0 0 0 5px rgba(34,197,94,0); } }
  @keyframes bellSwing{ 0%,60%,100%{ transform:rotate(0); } 70%{ transform:rotate(-18deg); } 80%{ transform:rotate(16deg); } 90%{ transform:rotate(-8deg); } }

  .toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none; z-index:9999;
    background:#0F1B3D; color:#fff; font-weight:800; font-size:13px; padding:11px 18px; border-radius:999px; box-shadow:0 12px 30px rgba(15,27,61,0.35); transition:all .25s ease; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce){ .status-hero, .step.now .dot, .anim-flip, .anim-spin, .anim-bounce, .anim-pop, .chat-head .presence i, .remind-btn .bell{ animation:none !important; } }
</style>

</head>
<body>

<a href="index.html" class="logo">BUY<span>RBLX</span></a>

<div class="wrap">
  <div id="reminder-banner">🔔 <span id="reminder-text">Seller is waiting for you!</span></div>

  <div class="card" id="orderSummaryCard">
    <p class="sub">Loading your order…</p>
  </div>

  <div class="card" id="deliveryActionsCard" style="display:none;"></div>

  <div class="card">
    <div class="chat-head">
      <span class="ph" id="chatHeadAvatar"></span>
      <div>
        <div class="name">💬 Chat with the seller</div>
        <div class="presence"><i></i> Real person · usually replies in minutes</div>
      </div>
      <button class="remind-btn" id="remindBtn" onclick="remindSeller()" title="Ping the seller (or type !remind)"><span class="bell">🔔</span> Remind seller</button>
    </div>
    <div class="chat-helper-tip">
      💡 <b>Questions about receiving your item?</b> Ask here. Seller taking a while? Tap <b>Remind seller</b> or type <b>!remind</b>. Need something else? <a href="support.html">Visit Support</a>.
    </div>
    <div id="chat-box"></div>
    <div class="reply-preview-bar" id="replyPreviewBar">
      <span class="reply-text" id="replyPreviewText"></span>
      <span class="reply-cancel" onclick="cancelReply()">✕</span>
    </div>
    <div class="send-preview" id="sendPreview">
      <img id="previewImg" src="">
      <span style="font-size:12.5px; color:var(--muted); font-weight:700;">Send this image?</span>
      <div class="preview-actions">
        <button class="cancel-send" onclick="cancelPendingImage()">Cancel</button>
        <button class="confirm-send" onclick="confirmSendPendingImage()">Send</button>
      </div>
    </div>
    <div class="chat-row">
      <input type="file" id="chat-file-input" accept="image/*" style="display:none;" onchange="handleFileSelect(event)">
      <button class="attach-btn" onclick="document.getElementById('chat-file-input').click()" title="Attach screenshot">📎</button>
      <button class="emoji-btn" onclick="toggleEmojiPicker()" title="Emoji" style="position:relative;">😊
      <div class="emoji-picker" id="emojiPicker">
        <span onclick="insertEmoji(&quot;😀&quot;)">😀</span><span onclick="insertEmoji(&quot;😂&quot;)">😂</span><span onclick="insertEmoji(&quot;😍&quot;)">😍</span><span onclick="insertEmoji(&quot;😘&quot;)">😘</span><span onclick="insertEmoji(&quot;😎&quot;)">😎</span><span onclick="insertEmoji(&quot;🤩&quot;)">🤩</span><span onclick="insertEmoji(&quot;🥳&quot;)">🥳</span><span onclick="insertEmoji(&quot;😭&quot;)">😭</span><span onclick="insertEmoji(&quot;😢&quot;)">😢</span><span onclick="insertEmoji(&quot;😡&quot;)">😡</span><span onclick="insertEmoji(&quot;😱&quot;)">😱</span><span onclick="insertEmoji(&quot;🤔&quot;)">🤔</span><span onclick="insertEmoji(&quot;🙄&quot;)">🙄</span><span onclick="insertEmoji(&quot;😴&quot;)">😴</span><span onclick="insertEmoji(&quot;🤗&quot;)">🤗</span><span onclick="insertEmoji(&quot;👍&quot;)">👍</span><span onclick="insertEmoji(&quot;👎&quot;)">👎</span><span onclick="insertEmoji(&quot;👏&quot;)">👏</span><span onclick="insertEmoji(&quot;🙏&quot;)">🙏</span><span onclick="insertEmoji(&quot;💪&quot;)">💪</span><span onclick="insertEmoji(&quot;🤝&quot;)">🤝</span><span onclick="insertEmoji(&quot;✋&quot;)">✋</span><span onclick="insertEmoji(&quot;👋&quot;)">👋</span><span onclick="insertEmoji(&quot;💯&quot;)">💯</span><span onclick="insertEmoji(&quot;🔥&quot;)">🔥</span><span onclick="insertEmoji(&quot;✨&quot;)">✨</span><span onclick="insertEmoji(&quot;💰&quot;)">💰</span><span onclick="insertEmoji(&quot;🎉&quot;)">🎉</span><span onclick="insertEmoji(&quot;❤️&quot;)">❤️</span><span onclick="insertEmoji(&quot;💙&quot;)">💙</span><span onclick="insertEmoji(&quot;💚&quot;)">💚</span><span onclick="insertEmoji(&quot;💛&quot;)">💛</span><span onclick="insertEmoji(&quot;🧡&quot;)">🧡</span><span onclick="insertEmoji(&quot;💜&quot;)">💜</span><span onclick="insertEmoji(&quot;🖤&quot;)">🖤</span><span onclick="insertEmoji(&quot;🤍&quot;)">🤍</span><span onclick="insertEmoji(&quot;💔&quot;)">💔</span><span onclick="insertEmoji(&quot;😊&quot;)">😊</span><span onclick="insertEmoji(&quot;😅&quot;)">😅</span><span onclick="insertEmoji(&quot;😉&quot;)">😉</span><span onclick="insertEmoji(&quot;😇&quot;)">😇</span><span onclick="insertEmoji(&quot;🥺&quot;)">🥺</span><span onclick="insertEmoji(&quot;😏&quot;)">😏</span><span onclick="insertEmoji(&quot;🤨&quot;)">🤨</span><span onclick="insertEmoji(&quot;😬&quot;)">😬</span>
      </div></button>
      <input type="text" id="chat-input" placeholder="Type a message…">
      <button class="send-btn" onclick="sendMessage()" title="Send">➤</button>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const orderId = urlParams.get('id');
  const REMIND_COOLDOWN_MS = 5 * 60 * 1000;
  let currentUser = null;
  let currentOrder = null;
  const SELLER_ROBLOX_USERNAME = 'Jethro_poter';
  let sellerAvatarUrl = '';
  let pendingImageFile = null;

  async function loadSellerAvatar(){
    try {
      const { data } = await supabaseClient.functions.invoke('verify-roblox', { body: { username: SELLER_ROBLOX_USERNAME } });
      if(data && data.success){
        sellerAvatarUrl = data.avatarUrl || '';
        const head = document.getElementById('chatHeadAvatar');
        if(head && safeUrl(sellerAvatarUrl)) head.outerHTML = `<img id="chatHeadAvatar" src="${safeUrl(sellerAvatarUrl)}" alt="">`;
      }
    } catch(e){ /* avatar is a nice-to-have, ignore failures */ }
  }

  const audioCtx = typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined'
    ? new (window.AudioContext || window.webkitAudioContext)() : null;
  function playChime(){
    if(!audioCtx) return;
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
  }

  let originalTabTitle = document.title;
  let titleFlashInterval = null;
  function triggerReminder(text){
    playChime();
    document.getElementById('reminder-banner').style.display = 'block';
    document.getElementById('reminder-text').textContent = text;
    if(!titleFlashInterval){
      let flip = false;
      titleFlashInterval = setInterval(() => {
        document.title = flip ? originalTabTitle : '🔴 (1) SELLER ALERT!';
        flip = !flip;
      }, 1000);
    }
  }
  window.addEventListener('focus', () => {
    if(titleFlashInterval){ clearInterval(titleFlashInterval); titleFlashInterval = null; document.title = originalTabTitle; }
  });

  const STATUS_LABELS = {
    waiting_for_seller: '⏳ Waiting for Seller',
    in_progress: '🔄 In Progress',
    delivered: '📦 Delivered — Please Confirm',
    completed: '✅ Completed',
    disputed: '🛑 Under Review',
    cancelled: '❌ Cancelled'
  };

  function formatMoney(n){ return '$' + Number(n).toFixed(2); }

  // Buyer's view of the order: animated header + where it is in the journey.
  const HERO = {
    waiting_for_seller: { cls:'s-waiting',   ico:'<span class="anim-flip">⏳</span>',  title:'Waiting for the seller to accept', sub:"Usually just a few minutes — we'll email you when they reply.", step:1 },
    in_progress:        { cls:'s-progress',  ico:'<span class="anim-spin">🔄</span>',  title:'Your order is in progress',        sub:'The seller is on it — keep an eye on the chat below.', step:2 },
    delivered:          { cls:'s-delivered', ico:'<span class="anim-bounce">📦</span>', title:'Delivered! Please confirm',        sub:"Got your item? Tap \"I Received It\" below.", step:3 },
    completed:          { cls:'s-completed', ico:'<span class="anim-pop">🎉</span>',    title:'Order complete',                   sub:'Thanks for shopping with BuyRBLX!', step:5 },
    disputed:           { cls:'s-disputed',  ico:'🛑', title:'Your report is under review', sub:"A real person is looking into it — you'll hear back here." },
    cancelled:          { cls:'s-cancelled', ico:'❌', title:'Order cancelled',             sub:'Questions? Reach us through Support.' },
  };
  const STEPS = ['Paid', 'Accepted', 'Delivering', 'Delivered', 'Done'];

  function statusHero(status){
    const c = HERO[status] || { cls:'s-cancelled', ico:'•', title: escapeHtml(status), sub:'' };
    const steps = c.step === undefined ? '' : `<div class="steps">${STEPS.map((label, i) => {
      const state = i < c.step ? 'done' : i === c.step ? 'now' : '';
      return `<div class="step ${state}"><div class="dot">${i < c.step ? '✓' : i + 1}</div>${label}</div>`;
    }).join('')}</div>`;
    return `<div class="status-hero ${c.cls}">
      <div class="hero-top"><div class="hero-ico">${c.ico}</div><div><div class="hero-title">${c.title}</div><div class="hero-sub">${c.sub}</div></div></div>
      ${steps}
    </div>`;
  }

  async function renderSummary(order){
    currentOrder = order;
    const items = (order.items_json || []).map(i =>
      `<div class="item-line">• ${escapeHtml(i.game || '')}: ${escapeHtml(i.item || '')} x${Number(i.qty) || 1} ($${Number(i.price).toFixed(2)})</div>`
    ).join('');

    let reviewPromptHtml = '';
    if(order.status === 'completed'){
      try {
        const { data: needsReview } = await supabaseClient.rpc('order_needs_review', { p_order_id: order.id });
        if(needsReview){
          reviewPromptHtml = `
            <div id="starReviewPrompt" style="margin-top:16px; padding:16px; background:#F7F9FF; border:1px solid var(--card-border); border-radius:14px; text-align:center;">
              <p style="font-weight:800; font-size:14px; margin-bottom:10px;">If it's okay with you, we'd love to hear your thoughts about us 🙂</p>
              <div id="quickStars" style="font-size:30px; letter-spacing:4px; cursor:pointer;">
                ${[1,2,3,4,5].map(n => `<span data-star="${n}" onclick="submitQuickStarReview(${n})">☆</span>`).join('')}
              </div>
            </div>
          `;
        }
      } catch(e){ console.warn('Could not check review status:', e); }
    }

    document.getElementById('orderSummaryCard').innerHTML = `
      <a href="index.html" class="back-home-link">← Back to Home</a>
      ${statusHero(order.status)}
      <h2>Order #${order.order_number}</h2>
      ${items}
      <div class="total-line">Total: ${formatMoney(order.total_amount)}</div>
      ${reviewPromptHtml}
    `;

    const remindBtn = document.getElementById('remindBtn');
    if(remindBtn) remindBtn.style.display = ['waiting_for_seller', 'in_progress', 'delivered', 'disputed'].includes(order.status) ? '' : 'none';

    const actionsCard = document.getElementById('deliveryActionsCard');
    if(order.status === 'delivered'){
      actionsCard.style.display = 'block';
      actionsCard.innerHTML = `
        <h2>📦 Delivery Proof</h2>
        ${safeUrl(order.proof_image_url) ? `<div class="proof-box"><img src="${safeUrl(order.proof_image_url)}" alt="Delivery proof"></div>` : '<p class="sub">No proof image attached.</p>'}
        <p class="sub" style="margin-top:10px;">Did you receive your item?</p>
        <div class="action-row">
          <button class="btn-confirm" onclick="confirmDelivery()">✅ I Received It</button>
          <button class="btn-report" onclick="showReportForm()">⚠️ Report an Issue</button>
        </div>
        <div id="reportForm" style="display:none; margin-top:10px;">
          <select id="disputeReason">
            <option value="I didn't receive it">I didn't receive it</option>
            <option value="I don't know how to claim it">I don't know how to claim it</option>
            <option value="Wrong item">Wrong item</option>
            <option value="Other">Other</option>
          </select>
          <textarea id="disputeDetails" placeholder="Any extra details? (optional)" rows="3"></textarea>
          <button class="btn-report" style="width:100%; margin-top:8px;" onclick="submitReport()">Submit Report</button>
        </div>
      `;
    } else if(order.status === 'disputed'){
      actionsCard.style.display = 'block';
      actionsCard.innerHTML = `<h2>🛑 Your Report Is Under Review</h2><p class="sub">We're looking into it — you'll hear back here shortly.</p>`;
    } else if(order.status === 'completed'){
      actionsCard.style.display = 'block';
      actionsCard.innerHTML = `<div class="center">🎉<br><b>Order complete — thank you!</b></div>`;
    } else {
      actionsCard.style.display = 'none';
    }
  }

  async function loadOrder(){
    if(!orderId){
      document.getElementById('orderSummaryCard').innerHTML = `
        <a href="index.html" class="back-home-link">← Back to Home</a>
        <p class="sub">No order specified.</p>
      `;
      return;
    }
    const { data: { session } } = await supabaseClient.auth.getSession();
    currentUser = session ? session.user : null;
    if(!currentUser){
      document.getElementById('orderSummaryCard').innerHTML = `
        <a href="index.html" class="back-home-link">← Back to Home</a>
        <p class="sub">Please <a href="login.html">log in</a> to view this order.</p>
      `;
      return;
    }
    const { data: order, error } = await supabaseClient.from('orders').select('*').eq('id', orderId).single();
    if(error || !order){
      document.getElementById('orderSummaryCard').innerHTML = `
        <a href="index.html" class="back-home-link">← Back to Home</a>
        <p class="sub">Order not found, or you don't have access to it.</p>
      `;
      return;
    }
    renderSummary(order);
    await loadMessages();
    subscribeRealtime();
    // They've opened the order — clear "seller is waiting for you" if it was set.
    try { await supabaseClient.rpc('clear_seller_waiting_flag', { p_order_id: order.id }); } catch(e){}
  }

  async function loadMessages(){
    const { data: messages } = await supabaseClient
      .from('order_messages')
      .select('*')
      .eq('order_id', orderId)
      .order('created_at', { ascending: true });
    const box = document.getElementById('chat-box');
    box.innerHTML = '';
    if(!messages || !messages.length){
      box.innerHTML = '<div class="chat-empty" id="chatEmpty"><span class="big">👋</span>Say hi to your seller!<br>They\'ll message you here with delivery steps.</div>';
      return;
    }
    messages.forEach(renderMessage);
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Only plain https links may go into src/href attributes.
  function safeUrl(url){
    return /^https:\/\/[^\s"'<>]+$/.test(url || '') ? url : '';
  }

  const REMIND_TEXT = '🔔 Reminder sent to the seller';

  function formatTime(ts){
    if(!ts) return '';
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }


  const QUICK_REACTIONS = ['👍','❤️','😂','😮','😢','🙏'];

  function renderReactionPills(reactions, msgId, mySenderType){
    if(!reactions) return '';
    const entries = Object.entries(reactions).filter(([emoji, list]) => list && list.length > 0);
    if(entries.length === 0) return '';
    return `<div class="reaction-pills">${entries.map(([emoji, list]) => {
      const mine = list.includes(mySenderType);
      // Clicking YOUR OWN reaction removes it. Clicking a reaction that's
      // only from the other person shows who reacted, instead of silently
      // stacking your own reaction onto it.
      const action = mine
        ? `sendReaction('${msgId}','${emoji}',event)`
        : `showWhoReacted('${list.join(",")}','${emoji}',event)`;
      return `<span class="reaction-pill ${mine ? 'mine' : ''}" onclick="${action}">${emoji} ${list.length}</span>`;
    }).join('')}</div>`;
  }

  window.showWhoReacted = function(whoList, emoji, event){
    if(event) event.stopPropagation();
    const names = whoList.split(',').map(s => s === 'buyer' ? 'Buyer' : s === 'seller' ? 'Seller' : s);
    alert(names.join(', ') + ' reacted ' + emoji);
  };

  function reactionBarHtml(msgId){
    return `<div class="reaction-bar" id="reactbar-${msgId}">${QUICK_REACTIONS.map(e => `<span onclick="sendReaction('${msgId}','${e}',event)">${e}</span>`).join('')}</div>`;
  }

  window.toggleReactionBar = function(msgId, event){
    event.stopPropagation();
    document.querySelectorAll('.reaction-bar').forEach(b => { if(b.id !== 'reactbar-' + msgId) b.style.display = 'none'; });
    const bar = document.getElementById('reactbar-' + msgId);
    if(bar) bar.style.display = bar.style.display === 'flex' ? 'none' : 'flex';
  };

  document.addEventListener('click', function(){
    document.querySelectorAll('.reaction-bar').forEach(b => b.style.display = 'none');
  });

  window.toggleEmojiPicker = function(){
    const picker = document.getElementById('emojiPicker');
    picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
  };

  window.insertEmoji = function(emoji){
    const input = document.getElementById('chat-input');
    input.value += emoji;
    input.focus();
    document.getElementById('emojiPicker').style.display = 'none';
  };

  document.addEventListener('click', function(e){
    const picker = document.getElementById('emojiPicker');
    if(picker && picker.style.display === 'grid' && !e.target.closest('.emoji-btn') && !e.target.closest('.emoji-picker')){
      picker.style.display = 'none';
    }
  });

  function updateMessageReactions(msg, mySenderType){
    const wrap = document.querySelector(`[data-msg-id="${msg.id}"] .reaction-pills`);
    const html = renderReactionPills(msg.reactions, msg.id, mySenderType);
    if(wrap){
      wrap.outerHTML = html || '<div class="reaction-pills"></div>';
    }
  }

  function renderMessage(msg){
    const box = document.getElementById('chat-box');
    const empty = document.getElementById('chatEmpty');
    if(empty) empty.remove();
    const row = document.createElement('div');
    row.setAttribute('data-msg-id', msg.id);

    if(msg.sender_type === 'buyer' && msg.message === REMIND_TEXT){
      row.className = 'msg-row system-row remind-row';
      row.innerHTML = `
        <div class="bubble">🔔 You reminded the seller — they've been pinged!</div>
        <div class="msg-time">${formatTime(msg.created_at)}</div>
      `;
    } else if(msg.is_delivery){
      row.className = 'msg-row system-row delivery-row';
      row.innerHTML = `
        <div class="bubble">
          <div class="delivery-title">📦 Order Delivered</div>
          ${safeUrl(msg.image_url) ? `<img class="chat-img" src="${safeUrl(msg.image_url)}" onclick="openImageLightbox('${safeUrl(msg.image_url)}')" style="max-width:260px; max-height:260px;">` : ''}
        </div>
        <div class="msg-time">${formatTime(msg.created_at)}</div>
      `;
    } else if(msg.sender_type === 'system' || msg.is_reminder){
      row.className = 'msg-row system-row';
      row.innerHTML = `
        <div class="bubble">${msg.is_reminder ? '🔔 ' : ''}${escapeHtml(msg.message || '')}</div>
        <div class="msg-time">${formatTime(msg.created_at)}</div>
      `;
    } else {
      const isMine = msg.sender_type === 'buyer';
      const imgHtml = safeUrl(msg.image_url) ? `<img class="chat-img" src="${safeUrl(msg.image_url)}" onclick="openImageLightbox('${safeUrl(msg.image_url)}')">` : '';
      const rawText = msg.message || '';
      const textHtml = rawText ? escapeHtml(rawText) : '';
      const avatarUrl = isMine ? (currentOrder ? currentOrder.roblox_avatar_url : '') : sellerAvatarUrl;
      const nameLabel = isMine ? 'You' : `Seller · ${SELLER_ROBLOX_USERNAME}`;
      const pillsHtml = renderReactionPills(msg.reactions, msg.id, 'buyer');
      const replyHtml = msg.reply_to_text ? `
        <div class="reply-quote" onclick="jumpToMessage('${msg.reply_to_id || ''}')">
          <span class="reply-quote-sender">${escapeHtml(msg.reply_to_sender || '')}</span>
          <span class="reply-quote-text">${escapeHtml(msg.reply_to_text)}</span>
        </div>` : '';
      row.setAttribute('data-msg-text', rawText);
      row.setAttribute('data-msg-mine', isMine ? '1' : '0');
      row.setAttribute('data-msg-sender-label', isMine ? 'You' : SELLER_ROBLOX_USERNAME);

      row.innerHTML = `
        <div class="msg-with-avatar ${isMine ? 'sent' : ''}">
          ${safeUrl(avatarUrl) ? `<img class="msg-avatar" src="${safeUrl(avatarUrl)}">` : '<span class="msg-avatar"></span>'}
          <div class="msg-row ${isMine ? 'sent' : 'received'}" style="max-width:100%;">
            <div class="bubble-wrap">
              <div class="bubble">${replyHtml}${textHtml}${imgHtml}</div>
              <span class="react-trigger" onclick="toggleReactionBar('${msg.id}', event)">🙂</span>
              ${reactionBarHtml(msg.id)}
            </div>
            ${pillsHtml || '<div class="reaction-pills"></div>'}
            <div class="msg-time">${nameLabel} · ${formatTime(msg.created_at)}</div>
          </div>
        </div>
      `;
    }

    box.appendChild(row);
    box.scrollTop = box.scrollHeight;
  }

  window.openImageLightbox = function(url){
    let overlay = document.getElementById('imgLightbox');
    if(!overlay){
      overlay = document.createElement('div');
      overlay.id = 'imgLightbox';
      overlay.className = 'img-lightbox';
      overlay.innerHTML = `<span class="img-lightbox-close" onclick="closeImageLightbox()">✕</span><img id="imgLightboxPic">`;
      overlay.addEventListener('click', (e) => { if(e.target === overlay) closeImageLightbox(); });
      document.body.appendChild(overlay);
    }
    document.getElementById('imgLightboxPic').src = url;
    overlay.classList.add('open');
  };

  window.closeImageLightbox = function(){
    const overlay = document.getElementById('imgLightbox');
    if(overlay) overlay.classList.remove('open');
  };

  window.jumpToMessage = function(msgId){
    if(!msgId) return;
    const el = document.querySelector(`[data-msg-id="${msgId}"]`);
    if(!el) return;
    el.scrollIntoView({behavior:'smooth', block:'center'});
    el.classList.add('flash-highlight');
    setTimeout(() => el.classList.remove('flash-highlight'), 1200);
  };

  window.sendReaction = async function(msgId, emoji, event){
    if(event) event.stopPropagation();
    const bar = document.getElementById('reactbar-' + msgId);
    if(bar) bar.style.display = 'none';
    const { error } = await supabaseClient.rpc('toggle_message_reaction', { p_message_id: msgId, p_emoji: emoji, p_sender_type: 'buyer' });
    if(error) console.error('Reaction failed:', error);
  };

  function showOrderConfirm(msg, onYes, confirmLabel){
    let overlay = document.getElementById('orderConfirmOverlay');
    if(!overlay){
      overlay = document.createElement('div');
      overlay.id = 'orderConfirmOverlay';
      overlay.style.cssText = `
        position:fixed; inset:0; background:rgba(15,27,61,0.45); z-index:9998;
        display:flex; align-items:center; justify-content:center;
        opacity:0; pointer-events:none; transition:opacity 0.2s ease;
      `;
      overlay.innerHTML = `
        <div id="orderConfirmBox" style="background:#fff; border-radius:16px; padding:22px 24px; max-width:320px; width:88vw; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,0.3); transform:scale(0.9); transition:transform 0.2s ease;">
          <p id="orderConfirmMsg" style="font-weight:800; font-size:14.5px; color:var(--ink); margin:0 0 18px;"></p>
          <div style="display:flex; gap:10px; justify-content:center;">
            <button id="orderConfirmNoBtn" style="font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px; border:none; border-radius:20px; padding:9px 18px; cursor:pointer; background:#EEF1F8; color:var(--ink);">Cancel</button>
            <button id="orderConfirmYesBtn" style="font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px; border:none; border-radius:20px; padding:9px 18px; cursor:pointer; background:#2F5FE0; color:#fff;">Yes</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      overlay.addEventListener('click', (e) => { if(e.target === overlay) hideOrderConfirm(); });
      document.getElementById('orderConfirmNoBtn').addEventListener('click', hideOrderConfirm);
    }
    document.getElementById('orderConfirmMsg').textContent = msg;
    document.getElementById('orderConfirmYesBtn').textContent = confirmLabel || 'Yes';
    const yesBtn = document.getElementById('orderConfirmYesBtn');
    const freshYesBtn = yesBtn.cloneNode(true);
    yesBtn.parentNode.replaceChild(freshYesBtn, yesBtn);
    freshYesBtn.addEventListener('click', () => { hideOrderConfirm(); onYes(); });
    overlay.style.opacity = '1';
    overlay.style.pointerEvents = 'auto';
    document.getElementById('orderConfirmBox').style.transform = 'scale(1)';
  }

  function hideOrderConfirm(){
    const overlay = document.getElementById('orderConfirmOverlay');
    if(!overlay) return;
    overlay.style.opacity = '0';
    overlay.style.pointerEvents = 'none';
    document.getElementById('orderConfirmBox').style.transform = 'scale(0.9)';
  }

  window.unsendMessage = async function(msgId){
    showOrderConfirm('Unsend this message for everyone? This cannot be undone.', async () => {
      const { error } = await supabaseClient.from('order_messages').delete().eq('id', msgId);
      if(error){ alert('Could not unsend: ' + error.message); return; }
      const el = document.querySelector(`[data-msg-id="${msgId}"]`);
      if(el) el.remove();
    });
  };

  async function uploadChatImage(file){
    try {
      const ext = file.name.split('.').pop() || 'png';
      const path = `${orderId}/${Date.now()}.${ext}`;
      const { error: uploadError } = await supabaseClient.storage.from('chat-uploads').upload(path, file);
      if(uploadError){
        console.error('Upload error:', uploadError);
        alert('Image upload failed: ' + (uploadError.message || JSON.stringify(uploadError)));
        return null;
      }
      const { data } = supabaseClient.storage.from('chat-uploads').getPublicUrl(path);
      return data.publicUrl;
    } catch(e){
      console.error('Upload exception:', e);
      alert('Image upload crashed: ' + e.message);
      return null;
    }
  }

  function showImagePreview(file){
    pendingImageFile = file;
    document.getElementById('previewImg').src = URL.createObjectURL(file);
    document.getElementById('sendPreview').style.display = 'flex';
  }

  window.cancelPendingImage = function(){
    pendingImageFile = null;
    document.getElementById('sendPreview').style.display = 'none';
  };

  window.confirmSendPendingImage = async function(){
    if(!pendingImageFile || !currentUser) return;
    const file = pendingImageFile;
    pendingImageFile = null;
    document.getElementById('sendPreview').style.display = 'none';

    const url = await uploadChatImage(file);
    if(!url) return;
    const { data: savedImg, error: insertError } = await supabaseClient.from('order_messages').insert([{
      order_id: orderId,
      sender_type: 'buyer',
      sender_name: currentUser.email,
      message: '',
      image_url: url
    }]).select('id').single();
    if(insertError){
      console.error('Message insert error:', insertError);
      alert('Image uploaded but failed to post to chat: ' + insertError.message);
    } else {
      await supabaseClient.from('orders').update({ last_buyer_activity_at: new Date().toISOString() }).eq('id', orderId);
      if(savedImg) notifyDiscord({ event: 'order_chat', order_id: orderId, message_id: savedImg.id });
    }
  };

  window.handleFileSelect = function(event){
    const file = event.target.files[0];
    event.target.value = '';
    if(!file){ return; }
    if(!currentUser){ alert('You must be logged in to send an image.'); return; }
    showImagePreview(file);
  };

  document.getElementById('chat-input').addEventListener('paste', function(e){
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for(const item of items){
      if(item.type.indexOf('image') !== -1){
        const file = item.getAsFile();
        if(!currentUser){ alert('You must be logged in to send an image.'); return; }
        showImagePreview(file);
      }
    }
  });

  function subscribeRealtime(){
    supabaseClient
      .channel('order_' + orderId)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'order_messages', filter: `order_id=eq.${orderId}` }, (payload) => {
        renderMessage(payload.new);
        if(payload.new.is_reminder) triggerReminder(payload.new.message);
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'order_messages', filter: `order_id=eq.${orderId}` }, (payload) => {
        const el = document.querySelector(`[data-msg-id="${payload.old.id}"]`);
        if(el) el.remove();
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'order_messages', filter: `order_id=eq.${orderId}` }, (payload) => {
        updateMessageReactions(payload.new, 'buyer');
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders', filter: `id=eq.${orderId}` }, (payload) => {
        renderSummary(payload.new);
      })
      .subscribe();
  }

  let pendingReplyTo = null;

  window.startReply = function(msgId){
    const row = document.querySelector(`[data-msg-id="${msgId}"]`);
    if(!row) return;
    const text = row.getAttribute('data-msg-text') || '📷 Image';
    const senderLabel = row.getAttribute('data-msg-sender-label') || '';
    pendingReplyTo = { id: msgId, text, senderLabel };
    document.getElementById('replyPreviewText').textContent = `Replying to ${senderLabel}: ${text}`;
    document.getElementById('replyPreviewBar').style.display = 'flex';
    document.getElementById('chat-input').focus();
    hideMessageMenu();
  };

  window.cancelReply = function(){
    pendingReplyTo = null;
    document.getElementById('replyPreviewBar').style.display = 'none';
  };

  window.copyMessageText = function(msgId){
    const row = document.querySelector(`[data-msg-id="${msgId}"]`);
    const text = row ? (row.getAttribute('data-msg-text') || '') : '';
    if(navigator.clipboard && text){ navigator.clipboard.writeText(text); }
    hideMessageMenu();
  };

  window.reportMessageFromMenu = async function(msgId){
    hideMessageMenu();
    showOrderConfirm('Report this message to the BuyRBLX team?', async () => {
      const row = document.querySelector(`[data-msg-id="${msgId}"]`);
      const text = row ? (row.getAttribute('data-msg-text') || '(image)') : '(unknown)';
      try {
        await supabaseClient.from('message_reports').insert([{
          message_id: msgId, order_id: orderId, reported_by: currentUser.id, reported_message_text: text
        }]);
      } catch(e){ console.warn('Report insert failed:', e); }
      notifyDiscord({ event: 'message_report', message_id: msgId });
      alert('Reported — the team will review it.');
    }, 'Report');
  };

  function hideMessageMenu(){
    document.getElementById('msgContextMenu').style.display = 'none';
  }

  function showMessageMenu(msgId, x, y){
    const row = document.querySelector(`[data-msg-id="${msgId}"]`);
    if(!row) return;
    const isMine = row.getAttribute('data-msg-mine') === '1';
    const menu = document.getElementById('msgContextMenu');
    let html = `<div class="menu-item" onclick="startReply('${msgId}')">↩️ Reply</div>`;
    html += `<div class="menu-item" onclick="copyMessageText('${msgId}')">📋 Copy</div>`;
    html += `<div class="menu-divider"></div>`;
    if(isMine){
      html += `<div class="menu-item danger" onclick="unsendMessage('${msgId}'); hideMenuNow();">🗑 Delete / Unsend</div>`;
    } else {
      html += `<div class="menu-item danger" onclick="reportMessageFromMenu('${msgId}')">🚩 Report</div>`;
    }
    menu.innerHTML = html;
    menu.style.display = 'block';
    const menuWidth = 190;
    const left = Math.min(x, window.innerWidth - menuWidth - 10);
    const top = Math.min(y, window.innerHeight - 160);
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
  }

  window.hideMenuNow = hideMessageMenu;

  document.addEventListener('click', (e) => {
    if(!e.target.closest('.msg-context-menu')) hideMessageMenu();
  });

  // Long-press (works for touch AND mouse hold) on any message bubble opens
  // the Reply / Copy / Delete-or-Report menu — same interaction as Messenger.
  (function setupLongPress(){
    let pressTimer = null;
    let startX = 0, startY = 0;
    const box = document.getElementById('chat-box');

    function begin(e){
      const wrap = e.target.closest('.bubble-wrap') || e.target.closest('.bubble');
      if(!wrap) return;
      const row = e.target.closest('[data-msg-id]');
      if(!row) return;
      const point = e.touches ? e.touches[0] : e;
      startX = point.clientX; startY = point.clientY;
      pressTimer = setTimeout(() => {
        showMessageMenu(row.getAttribute('data-msg-id'), point.clientX, point.clientY);
      }, 480);
    }
    function cancel(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } }
    function move(e){
      const point = e.touches ? e.touches[0] : e;
      if(Math.abs(point.clientX - startX) > 10 || Math.abs(point.clientY - startY) > 10) cancel();
    }

    box.addEventListener('mousedown', begin);
    box.addEventListener('mouseup', cancel);
    box.addEventListener('mouseleave', cancel);
    box.addEventListener('mousemove', move);
    box.addEventListener('touchstart', begin, {passive:true});
    box.addEventListener('touchend', cancel);
    box.addEventListener('touchmove', move, {passive:true});

    // Right-click also opens it instantly (desktop convenience)
    box.addEventListener('contextmenu', (e) => {
      const row = e.target.closest('[data-msg-id]');
      if(row){ e.preventDefault(); showMessageMenu(row.getAttribute('data-msg-id'), e.clientX, e.clientY); }
    });
  })();

  window.sendMessage = async function(){
    const input = document.getElementById('chat-input');
    let text = input.value.trim();
    if(!text) return;
    if(text.toLowerCase() === '!remind'){
      input.value = '';
      remindSeller();
      return;
    }
    const replySnapshot = pendingReplyTo;
    if(pendingReplyTo){
      pendingReplyTo = null;
      document.getElementById('replyPreviewBar').style.display = 'none';
    }
    input.value = '';
    const { data: saved } = await supabaseClient.from('order_messages').insert([{
      order_id: orderId,
      sender_type: 'buyer',
      sender_name: currentUser.email,
      message: text,
      reply_to_id: replySnapshot ? replySnapshot.id : null,
      reply_to_text: replySnapshot ? replySnapshot.text.slice(0,120) : null,
      reply_to_sender: replySnapshot ? replySnapshot.senderLabel : null
    }]).select('id').single();
    await supabaseClient.from('orders').update({ last_buyer_activity_at: new Date().toISOString() }).eq('id', orderId);
    if(saved) notifyDiscord({ event: 'order_chat', order_id: orderId, message_id: saved.id });
  };

  function showToast(text){
    let t = document.getElementById('toast');
    if(!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(t._hide);
    t._hide = setTimeout(() => t.classList.remove('show'), 2800);
  }

  function lastRemindAt(){
    try { return Number(localStorage.getItem('remind_' + orderId)) || 0; } catch(e){ return 0; }
  }

  // "Remind seller" button or typing !remind: drops a note in the chat and
  // @mentions the owner in this order's Discord thread. 5-minute cooldown.
  window.remindSeller = async function(){
    if(!currentOrder || !currentUser) return;
    if(!['waiting_for_seller', 'in_progress', 'delivered', 'disputed'].includes(currentOrder.status)){
      showToast('This order is already finished 🙂');
      return;
    }
    const waitMs = REMIND_COOLDOWN_MS - (Date.now() - lastRemindAt());
    if(waitMs > 0){
      showToast(`⏳ You can remind again in ${Math.ceil(waitMs / 60000)} min`);
      return;
    }
    try { localStorage.setItem('remind_' + orderId, String(Date.now())); } catch(e){}
    const btn = document.getElementById('remindBtn');
    if(btn){ btn.disabled = true; setTimeout(() => { btn.disabled = false; }, REMIND_COOLDOWN_MS); }

    await supabaseClient.from('order_messages').insert([{
      order_id: orderId, sender_type: 'buyer', sender_name: currentUser.email, message: REMIND_TEXT
    }]);
    await supabaseClient.from('orders').update({ last_buyer_activity_at: new Date().toISOString() }).eq('id', orderId);

    notifyDiscord({ event: 'order_remind', order_id: orderId });
    showToast('🔔 Seller reminded!');
  };

  // Discord pings go through our server (discord-notify), which checks the
  // request and builds the message — no webhook URLs in this page.
  async function notifyDiscord(body){
    try {
      await supabaseClient.functions.invoke('discord-notify', { body });
    } catch(e){
      console.warn('Discord notification failed (nothing else is affected):', e);
    }
  }

  window.showReportForm = function(){
    document.getElementById('reportForm').style.display = 'block';
  };

  window.confirmDelivery = async function(){
    showOrderConfirm('Are you sure? Confirm you received your item?', async () => {
      const { error } = await supabaseClient.rpc('buyer_confirm_delivery', { p_order_id: orderId });
      if(error){ alert('Something went wrong — please try again.'); return; }
      const { data: order } = await supabaseClient.from('orders').select('*').eq('id', orderId).single();
      if(order) renderSummary(order);
      notifyDiscord({ event: 'order_confirmed', order_id: orderId });
    }, "Yes, I got it");
  };

  window.submitQuickStarReview = async function(stars){
    // Fill stars visually right away, before the network call finishes
    document.querySelectorAll('#quickStars span').forEach(s => {
      s.textContent = Number(s.dataset.star) <= stars ? '★' : '☆';
      s.style.color = Number(s.dataset.star) <= stars ? '#F2B705' : '';
    });
    try {
      const { data, error } = await supabaseClient.rpc('submit_review', {
        p_order_id: currentOrder.id,
        p_name: currentOrder.roblox_username || 'Buyer',
        p_stars: stars,
        p_review_text: ''
      });
      if(error) throw error;
      const prompt = document.getElementById('starReviewPrompt');
      if(prompt){
        prompt.innerHTML = '<p style="font-weight:800; font-size:14px; color:var(--success);">🙏 Thanks so much for the feedback!</p>';
      }
    } catch(e){
      console.warn('Quick star review failed:', e);
    }
  };

  window.submitReport = async function(){
    const reasonSelect = document.getElementById('disputeReason').value;
    const details = document.getElementById('disputeDetails').value.trim();
    const fullReason = details ? `${reasonSelect} — ${details}` : reasonSelect;
    const { error } = await supabaseClient.rpc('buyer_report_issue', { p_order_id: orderId, p_reason: fullReason });
    if(error){ alert('Something went wrong — please try again.'); return; }
    const { data: order } = await supabaseClient.from('orders').select('*').eq('id', orderId).single();
    if(order) renderSummary(order);
    notifyDiscord({ event: 'order_disputed', order_id: orderId });
  };

  document.getElementById('chat-input').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') sendMessage();
  });

  loadSellerAvatar();
  loadOrder();
</script>

<div class="msg-context-menu" id="msgContextMenu"></div>
</body>
</html>
