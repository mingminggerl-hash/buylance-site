<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Verified | Buylance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#EEF3FF; --ink:#0F1B3D; --brand-blue:#2F5FE0;
    --muted:#6B7A99; --card-border:#D7E3FF; --success:#1E8E3E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:linear-gradient(180deg, var(--bg-top) 0%, #FFFFFF 320px);
    color:var(--ink); font-family:'Nunito Sans', sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  .logo{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:24px;
    text-decoration:none; color:var(--ink); margin-bottom:26px;
  }
  .logo span{ color:var(--brand-blue); }
  .card{
    background:#fff; border:1px solid var(--card-border); border-radius:18px;
    padding:38px 30px; width:100%; max-width:380px; text-align:center;
  }
  .big{ font-size:52px; margin-bottom:14px; }
  h1{ font-family:'Baloo 2', sans-serif; font-size:22px; margin-bottom:8px; color:var(--success); }
  .sub{ color:var(--muted); font-size:14px; font-weight:600; margin-bottom:22px; line-height:1.6; }
  a.btn{
    display:inline-block; width:100%; background:var(--brand-blue); color:#fff; text-decoration:none;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px;
    padding:13px; border-radius:10px; box-sizing:border-box;
  }
</style>
</head>
<body>

<a href="index.html" class="logo">BUY<span>LANCE</span></a>

<div class="card">
  <div class="big">✅</div>
  <h1>Your Email Has Been Verified</h1>
  <p class="sub">Thanks for signing up! Your account is all set — go back and log in whenever you're ready.</p>
  <a href="login.html" class="btn">Go back and Log In</a>
</div>

</body>
</html>
